apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-template
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thdev-mobile-team/spring-boot-template.git
    targetRevision: main
    path: charts/rpe-spring-boot-template
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://192.168.125.101:6443
    namespace: springboot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
